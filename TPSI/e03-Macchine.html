<!DOCTYPE html>
<!-- 
    IL file rubrica.html e rubrica.json DEVONO ESSERE inseriti nella cartella
    c:\uwamp\www\tpsi\json
    DEVI richiamare il file HTML con la URL, come fosse un sito web.
    http://localhost/tpsi/json/rubrica.html
 -->
<html>
    <head>
        <title>Archivio di macchine</title>
        <button id="btnCaricaJSON">Carica Intera Lista</button>
        <br /><br />
        Et&agrave; minima: <input type="text" id="anniRichiesti">
        <button id="btnEtaMinima">Et&agrave; maggiore o uguale di...</button>
        <br /><br />
        <div id="viewBox" style="border: solid 1px rgb(200,0,0);">Seleziona una opzione</div>

        <script>
            async function LeggiArchivio(){
                const promise = await fetch("e03_Macchine.json");
                const vettArchivio = await promise.json();
                let vb = document.querySelector("#viewBox");
                vb.innerHTML = "Numero di JSON ricevuti: "+vettArchivio.length+"<br /><br />";
                for(let i=0; i < vettArchivio.length; i++){
                    vb.innerHTML += vettArchivio[i].Marca + " " + vettArchivio[i].Modello + " " + vettArchivio[i].Anno_immatricolazione + " " + vettArchivio[i].Provincia + " " + vettArchivio[i].Uniproprietario + " " + vettArchivio[i].Kilometraggio +  "<br />";
                }
            }
        </script>
    </head>
    <body>
        <h1>Gestionale autovetture</h1>
        <button id = "btnCaricaJSON">Carica tutto</button>
        <button id = "btnUniproprietario">Carica solo l'Uniproprietario</button>
    </body>
</html>
